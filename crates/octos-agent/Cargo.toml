[package]
name = "octos-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent runtime, tool execution, and coordination for octos"

[dependencies]
octos-core = { workspace = true }
octos-bus = { workspace = true }
octos-memory = { workspace = true }
octos-llm = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
# Shell-quote validator argv when wrapping command validators for a POSIX
# sandbox (so `sh -c` reconstructs the exact argv rather than word-splitting).
shlex = "1"
which = { workspace = true }
# Strip Windows `\\?\` verbatim path prefixes (from `fs::canonicalize`) before
# handing paths to external programs like git, which mangle `\\?\C:\…` into
# `//?/C:/…` and fail. No-op on Unix and on already-simple paths.
dunce = "1"
regex = { workspace = true }
ignore = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
# MCP over the official rmcp SDK, client side only: stdio + streamable-HTTP +
# OAuth 2.1 (the server-side features went with the retired `octos mcp-serve`).
rmcp = { version = "1.8", default-features = false, features = [
    "client",
    "auth",
    "macros",
    "base64",
    "transport-async-rw",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
oauth2 = "5"
# rmcp's `AuthClient` wraps a reqwest 0.13 client (rmcp's own reqwest major).
# Aliased so it coexists with octos's reqwest 0.12; cargo unifies both 0.13
# users to the same crate instance, so the type matches rmcp's expectations.
reqwest_rmcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
# Keyring for MCP OAuth token storage. The persistent platform backend is
# selected per-OS below (`[target.*]`); without one the crate falls back to a
# non-persistent in-memory mock, so login would silently lose tokens.
keyring = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
# planctl L1 literal layer (ast-gated, alongside the tree-sitter family).
tree-sitter-typescript = { workspace = true, optional = true }
pdf-extract = { workspace = true }
tempfile = { workspace = true }

# Persistent keyring backend per OS for MCP OAuth token storage. Feature-unioned
# with the base `keyring` dep above; each is compiled only for its target.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# Kernel keyutils (pure-Rust, no system libdbus) so it builds on stock CI/Linux.
# Session-scoped: tokens persist across octos invocations within a login session
# but not across reboot/logout (a Secret-Service backend would need system
# libdbus). Documented in the migration ADR.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

# #1976 — safe openat/mkdirat for the write-grant component-wise confined walk
# (closes the ancestor-symlink TOCTOU under the workspace-wide
# deny(unsafe_code) lint). Unix only; the Windows path uses the symlink-check
# fallback documented in `tools::write_grant`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[features]
# `ast` is a default feature: the planctl repo-map/spec scan and the
# `code_structure` tool hard-depend on tree-sitter, and a no-ast build
# would silently lose the ARC plan's repo-map rendering plus symbol
# navigation.
ast = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
default = ["ast"]

[lints]
workspace = true

[dev-dependencies]
# Test-time control of tokio's clock (`tokio::time::advance`/`start_paused`);
# previously supplied transitively by the `tokio-test` dev-dep.
tokio = { workspace = true, features = ["test-util"] }
