[package]
name = "octos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI interface for octos"

[[bin]]
name = "octos"
path = "src/main.rs"

[dependencies]
octos-core = { workspace = true }
octos-agent = { workspace = true }
octos-arc = { workspace = true }
octos-memory = { workspace = true }
octos-llm = { workspace = true }
octos-bus = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
colored = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }
uuid = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rustyline = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
fs2 = { workspace = true }
open = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
# #1057: `onboarding/workspace_probe` parses `workspace_policy.toml` to
# surface presence + parse errors during TUI onboarding. The probe re-uses
# `octos_agent::workspace_policy::WorkspacePolicy` as the canonical schema
# and only needs the `toml` deserializer entry point here.
toml = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# Optional deps gated by feature flags (api).
# CancellationToken powering the embedded stdio control plane's graceful
# shutdown signal (`EmbeddedStdioControl.shutdown`).
tokio-util = { version = "0.7", optional = true }
metrics = { workspace = true }

[target.'cfg(unix)'.dependencies]
rpassword = { workspace = true }
# `rustix::process::test_kill_process` — the kill(pid, 0) liveness probe in
# `src/build_cache/pool.rs` (review #3 D1). Unlike the `kill` binary, the
# syscall returns a distinguishable errno (ESRCH vs EPERM), and unlike
# `libc::kill` it is safe under the workspace-wide deny(unsafe_code).
rustix = { version = "1.1", features = ["process"] }

[features]
# chat, ACP and serve use one OUP dispatcher. Minimal library builds can opt
# out, but never silently fall back to independent chat/ACP agent loops.
default = ["api"]
api = ["dep:tokio-util"]
ast = ["octos-agent/ast"]

[lints]
workspace = true

[dev-dependencies]
# Wave-4 B3.4 — enable `test-utils` for octos-llm so the gateway's
# failover-surfacing tests can call `publish_failover_for_subscribers`.
# Production builds don't see this; only `cargo test -p octos-cli`.
octos-llm = { workspace = true, features = ["test-utils"] }

